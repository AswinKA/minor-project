name: signboard_translator
description: AI Signboard Reader & Translator - OCR and Translation App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  
  # Camera & Image Picker
  image_picker: ^1.0.5
  camera: ^0.10.5
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Text to Speech
  flutter_tts: ^3.8.3
  
  # Permissions
  permission_handler: ^11.1.0
  
  # Image Processing
  image: ^4.1.3
  
  # On-device ML (No Backend Required)
  google_mlkit_text_recognition: ^0.11.0
  google_mlkit_language_id: ^0.11.0
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
          weight: 700
